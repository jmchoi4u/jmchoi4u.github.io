---
layout: page
# One category's posts, as the same list rows the home page uses.
---

{% include lang.html %}

<div id="page-category" class="jm-listpage">
  <div class="jm-board-head">
    <h1><b>{{ page.title }}</b> 카테고리 글 {{ page.posts | size }}</h1>
    <a href="{{ '/browse/' | relative_url }}">전체 분류</a>
  </div>
  <ul class="jm-list">
    {% for post in page.posts %}
      {% include post-item.html post=post component='category_page' %}
    {% endfor %}
  </ul>
</div>
