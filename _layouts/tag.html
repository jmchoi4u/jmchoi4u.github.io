---
layout: page
# One tag's posts, as the same list rows the home page uses.
---

{% include lang.html %}

<div id="page-tag" class="jm-listpage">
  <div class="jm-board-head">
    <h1><b>#{{ page.title }}</b> 태그 글 {{ page.posts | size }}</h1>
    <a href="{{ '/tags/' | relative_url }}">전체 태그</a>
  </div>
  <ul class="jm-list">
    {% for post in page.posts %}
      {% include post-item.html post=post component='tag_page' %}
    {% endfor %}
  </ul>
</div>
