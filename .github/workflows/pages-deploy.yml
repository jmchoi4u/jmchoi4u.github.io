name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Hourly, so a scheduled (future-dated) post goes up after its time. The
  # due job skips the build when nothing has come due. GitHub delays and drops
  # scheduled runs most at the top of the hour, hence :17; the Worker's clock
  # (tools/oauth-worker.js, scheduled) is the steadier trigger when set up.
  schedule:
    - cron: "17 * * * *"

  # The Actions tab, or the Worker with due_check, which asks only for the
  # due check.
  workflow_dispatch:
    inputs:
      due_check:
        description: "Build only if a scheduled post is due"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  due:
    if: github.event_name == 'schedule' || inputs.due_check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Look for scheduled posts that are due
        id: check
        run: python3 tools/due-posts.py >> "$GITHUB_OUTPUT"

  build:
    needs: due
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && !inputs.due_check) || needs.due.outputs.build == 'true') }}
    # One build and deploy at a time; a newer one replaces one still running.
    # The due check stays outside the group, so a quiet hour cancels nothing.
    concurrency:
      group: "pages"
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Test browser features
        run: |
          node tools/test-jm-studio.mjs
          node tools/test-blog-analytics.mjs
          node tools/test-blog-home.mjs

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Test home category rendering
        run: bundle exec ruby tools/test-home-categories.rb

      # A card per post for links shared in KakaoTalk and elsewhere. If the
      # font or Pillow is unavailable the posts keep the default picture.
      - name: Draw share cards
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user pillow
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/card-font.otf" "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/public/static/Pretendard-Bold.otf"
          python3 tools/make-share-cards.py --font "$RUNNER_TEMP/card-font.otf"

      - name: Build site
        run: |
          bundle exec jekyll clean
          bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    needs: build
    # On a push the due job is skipped, and a skipped job upstream would
    # skip this one too unless the condition says otherwise.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A scheduled post that just went up was skipped by the push-time
  # notification (its date was still ahead), so e-mail the subscribers now.
  notify:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.due_check) && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start subscriber notifications
        run: gh workflow run notify-subscribers.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
